# Positive and negative rows for every rule of the contact-form-7-flamingo profile.
# Blogs 2 and 11 exist (their options tables), so {site} tables have wp_2_ and
# wp_11_ copies; blog 12 doesn't, so wp_12_ lookalikes must stay untouched.
tables: [wp_2_options, wp_11_options]
rules:
  "contact-form-7-flamingo.posts.post_content.flamingo_inbound":
    positive: {table: wp_posts, row: {post_content: "Call Anna on +44 7700 900123", post_type: "flamingo_inbound"}}
    negative: {table: wp_posts, row: {post_content: "Call Anna on +44 7700 900123", post_type: "xflamingo_inbound"}}
  "contact-form-7-flamingo.posts.post_title.flamingo_inbound":
    positive: {table: wp_2_posts, row: {post_title: "Call Anna on +44 7700 900123", post_type: "flamingo_inbound"}}
    negative: {table: wp_2_posts, row: {post_title: "Call Anna on +44 7700 900123", post_type: "xflamingo_inbound"}}
  "contact-form-7-flamingo.posts.post_title.flamingo_contact":
    positive: {table: wp_11_posts, row: {post_title: "anna.lee@example.com", post_type: "flamingo_contact"}}
    negative: {table: wp_11_posts, row: {post_title: "anna.lee@example.com", post_type: "xflamingo_contact"}}
  "contact-form-7-flamingo.posts.post_name.flamingo_contact":
    positive: {table: wp_posts, row: {post_name: "anna-lee", post_type: "flamingo_contact"}}
    negative: {table: wp_posts, row: {post_name: "anna-lee", post_type: "xflamingo_contact"}}
  "contact-form-7-flamingo.postmeta.meta_value._from":
