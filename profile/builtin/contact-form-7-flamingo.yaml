# Contact Form 7 keeps nothing; Flamingo stores its messages and the
# senders as posts (flamingo_inbound, flamingo_contact) with post meta.
id: contact-form-7-flamingo
name: Contact Form 7 with Flamingo
stack: wordpress
checked_against: "docs: https://plugins.svn.wordpress.org/flamingo/trunk/includes/class-inbound-message.php"
detect:
  options_any: [wpcf7] # Contact Form 7's settings; the rules only match Flamingo's posts and meta
  files: [wp-content/plugins/flamingo/flamingo.php]
rules:
  - {table: "{prefix}{site}posts", where: {post_type: flamingo_inbound}, column: post_content, rule: text, explain: "the message with every field the sender filled in"}
  - {table: "{prefix}{site}posts", where: {post_type: flamingo_inbound}, column: post_title, rule: text, explain: "the message subject"}
  - {table: "{prefix}{site}posts", where: {post_type: flamingo_contact}, column: post_title, rule: email, explain: "a contact's title is the sender's email"}
  - {table: "{prefix}{site}posts", where: {post_type: flamingo_contact}, column: post_name, rule: nicename, explain: "the slug, made from the sender's email"}
  - {table: "{prefix}{site}postmeta", where: {meta_key: _from}, column: meta_value, rule: text, explain: "the sender as name and email"}
  - {table: "{prefix}{site}postmeta", where: {meta_key: _from_email}, column: meta_value, rule: email, explain: "the sender's email"}
  - {table: "{prefix}{site}postmeta", where: {meta_key: _from_name}, column: meta_value, rule: full_name, explain: "the sender's name"}
  - {table: "{prefix}{site}postmeta", where: {meta_key: "_field_*"}, column: meta_value, rule: text, explain: "one form field of the message"}
  - {table: "{prefix}{site}postmeta", where: {meta_key: _meta}, column: meta_value, rule: "serialized:remote_ip=ip", explain: "the sender's IP address in the request details"}
  - {id: postmeta.meta_value._meta.user_agent, table: "{prefix}{site}postmeta", where: {meta_key: _meta}, column: meta_value, rule: "serialized:user_agent=user_agent", explain: "the sender's browser in the request details"}
  - {table: "{prefix}{site}postmeta", where: {meta_key: _email}, column: meta_value, rule: email, explain: "a contact's email"}
  - {table: "{prefix}{site}postmeta", where: {meta_key: _name}, column: meta_value, rule: full_name, explain: "a contact's name"}
  - {table: "{prefix}{site}postmeta", where: {meta_key: _props}, column: meta_value, rule: text, explain: "a contact's name parts, serialized"}
