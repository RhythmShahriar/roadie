# g03: an international clean site. CJK and RTL fake names on reserved
# addresses, Arabic-Indic digits, fiction phone numbers in UK, US and DE
# formats and IBAN-shaped order references that fail the checksum.
name: g03
stack: wordpress
production: [laden-demo.example]
rules:
  - {table: wp_users, column: user_email, fake: email}
  - {table: wp_wc_order_addresses, column: first_name, fake: first_name}
  - {table: wp_wc_order_addresses, column: last_name, fake: last_name}
  - {table: wp_wc_order_addresses, column: address_1, fake: street}
  - {table: wp_wc_order_addresses, column: email, fake: email}
  - {table: wp_wc_order_addresses, column: phone, fake: phone}
tables:
  - name: wp_users
    columns: [ID, user_login, user_email, display_name]
    rows:
      - [1, yamada, yamada.taro@example.jp.invalid, 山田 太郎]
      - [2, wang, wang.fang@example.com, 王芳]
      - [3, kim, minjun.kim@example.org, 김민준]
      - [4, haddad, layla.haddad@example.net, ليلى حداد]
      - [5, cohen, noa.cohen@example.com, נועה כהן]
  - name: wp_wc_order_addresses
    columns: [id, order_id, address_type, first_name, last_name, address_1, email, phone]
    rows:
      - [1, 201, billing, 太郎, 山田, 東京都千代田区1-1, yamada.taro@example.jp.invalid, "+44 7700 900123"]
      - [2, 202, billing, ليلى, حداد, شارع ٤٢, layla.haddad@example.net, "+٤٤ ٧٧٠٠ ٩٠٠١٢٣"]
      - [3, 203, billing, Jonas, Becker, Musterstraße 1, jonas.becker@example.de.invalid, "+49 30 23125 456"]
      - [4, 204, billing, Emily, Clark, 1 Sample Road, emily.clark@example.com, "(212) 555-0199"]
  - name: wp_posts
    columns: [ID, post_title, post_content]
    rows:
      - [30, 注文 201, "合計 ¥12,800。追跡番号 1Z999AA10123456784。"]
      - [31, طلب ٢٠٢, "المجموع ١٢٣٫٤٥ د.إ، رقم الطلب ٢٠٢"]
      - [32, Bestellung 203, "Referenz DE00ORDR1234567890123, Summe 45,90 €, Rückfragen unter +49 30 23125 456."]
      - [33, Order 204, "Ref GB00ORDR12345698765432. Call (212) 555-0199 or 07700 900456 with questions."]
  - name: wp_postmeta
    columns: [meta_id, post_id, meta_key, meta_value]
    rows:
      - [1, 32, _order_reference, DE00ORDR1234567890123]
      - [2, 33, _order_reference, GB00ORDR12345698765432]
      - [3, 30, _order_total, "12800"]
      - [4, 31, _order_total, "١٢٣٫٤٥"]
      - [5, 30, _billing_phone, "+44 7700 900987"]
