# The testbed's gate: the way in from the host, on 127.0.0.1:18920-18939
# only (see docker-compose.yml). Nothing goes out through it: start.sh
# drops every outbound connection beyond the sealed network.
#
#   18920 prod-wp       18925 sshd         18929 pg
#   18921 staging-wp    18926 prod-db      18930-18939 spare
#   18922 laravel       18927 staging-db
#   18923 mailpit       18928 laravel-db
#   18924 echo (API)
include /etc/nginx/modules/*.conf;
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
	worker_connections 512;
}

http {
	access_log off;
	client_max_body_size 64m;
	resolver 127.0.0.11 valid=10s ipv6=off;
	proxy_http_version 1.1;
	proxy_read_timeout 300s;
	proxy_set_header Host $http_host;
	proxy_set_header X-Forwarded-For $remote_addr;
	proxy_set_header Connection "";

	server {
		listen 18920;
		location / {
			set $up http://prod-wp:80;
			proxy_pass $up;
		}
	}
	server {
		listen 18921;
		location / {
			set $up http://staging-wp:80;
			proxy_pass $up;
		}
	}
	server {
		listen 18922;
		location / {
			set $up http://laravel:8000;
			proxy_pass $up;
		}
	}
	server {
		listen 18923;
		location / {
			set $up http://mailpit:8025;
			proxy_pass $up;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
		}
	}
	server {
		listen 18924;
		location / {
			set $up http://echo:8025;
			proxy_pass $up;
		}
	}
	# Health check for compose.
	server {
		listen 127.0.0.1:18999;
		location / {
			return 200 "ok\n";
		}
	}
}

stream {
	resolver 127.0.0.11 valid=10s ipv6=off;
	server {
		listen 18925;
		set $up sshd:22;
		proxy_pass $up;
	}
	server {
		listen 18926;
		set $up prod-db:3306;
		proxy_pass $up;
	}
	server {
		listen 18927;
		set $up staging-db:3306;
		proxy_pass $up;
	}
	server {
		listen 18928;
		set $up laravel-db:3306;
		proxy_pass $up;
	}
	server {
		listen 18929;
		set $up pg:5432;
		proxy_pass $up;
	}
}
