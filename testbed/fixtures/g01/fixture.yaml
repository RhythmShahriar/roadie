description: >-
  A clean small business staging that looks busy: its own info@ address
  (on the allow list in files/roadie.yaml), wordpress.org and github.com
  links, order totals, SKUs, EAN codes, Unix timestamps, UUIDs, parcel
  tracking numbers, RFC 5737 IPs and Stripe test keys. Nothing here may
  be flagged at low or above.
