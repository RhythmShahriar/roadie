  - id: r24
    kind: env
    stack: wordpress
    title: hostile dumps
    input: r24
    run: staging-wp
    setup: [staging-site]
    absent: ["/tmp/roadie-r24-*"]
    cases:
      - name: bang
        setup: [snapshot]
        command: [copy, --from, "${in}/bang.sql", --to, "${site}", --url, "${staging_url}", --confirm-target, "${confirm}", --yes, --json]
        expect: {exit_code: 3, error_code: dump-refused, unchanged: true}
      - name: system
        setup: [snapshot]
        command: [copy, --from, "${in}/system.sql", --to, "${site}", --url, "${staging_url}", --confirm-target, "${confirm}", --yes, --json]
        expect: {exit_code: 3, error_code: dump-refused, unchanged: true}
      - name: source
        setup: [snapshot]
        command: [copy, --from, "${in}/source.sql", --to, "${site}", --url, "${staging_url}", --confirm-target, "${confirm}", --yes, --json]
        expect: {exit_code: 3, error_code: dump-refused, unchanged: true}
      - name: use-mysql
        setup: [snapshot]
        command: [copy, --from, "${in}/usemysql.sql", --to, "${site}", --url, "${staging_url}", --confirm-target, "${confirm}", --yes, --json]
        expect: {exit_code: 3, error_code: dump-refused, unchanged: true}
      # GRANT is dropped with a plan line (PRD 10.5), not refused.
      - name: grant
        command: [copy, --from, "${in}/grant.sql", --to, "${site}", --url, "${staging_url}", --confirm-target, "${confirm}", --yes, --json]
        wp_checks:
          - name: no grant reached the server
            php: 'global $wpdb; $g = implode("\n", $wpdb->get_col("SHOW GRANTS")); exit(stripos($g, "ALL PRIVILEGES ON *.*") === false ? 0 : 1);'
        expect: {exit_code: 0}
      - name: load-data
        setup: [snapshot]
        command: [copy, --from, "${in}/loaddata.sql", --to, "${site}", --url, "${staging_url}", --confirm-target, "${confirm}", --yes, --json]
        expect: {exit_code: 3, error_code: dump-refused, unchanged: true}
      - name: into-outfile
        setup: [snapshot]
        command: [copy, --from, "${in}/outfile.sql", --to, "${site}", --url, "${staging_url}", --confirm-target, "${confirm}", --yes, --json]
        expect: {exit_code: 3, error_code: dump-refused, unchanged: true}
      - name: trigger
        setup: [snapshot]
        command: [copy, --from, "${in}/trigger.sql", --to, "${site}", --url, "${staging_url}", --confirm-target, "${confirm}", --yes, --json]
        expect: {exit_code: 3, error_code: dump-refused, unchanged: true}
      - name: gzip-bomb
        setup: [snapshot]
        make: gzip-bomb
        command: [copy, --from, "${in}/bomb.sql.gz", --to, "${site}", --url, "${staging_url}", --confirm-target, "${confirm}", --yes, --json]
        expect: {exit_code: 3, error_code: dump-bomb, unchanged: true}
      - name: wpress
        setup: [snapshot]
        make: wpress
        command: [copy, --from, "${in}/archive.sql", --to, "${site}", --url, "${staging_url}", --confirm-target, "${confirm}", --yes, --json]
        expect: {exit_code: 2, error_code: dump-format, unchanged: true}

  - id: r25
    kind: env
    stack: woocommerce
    title: production refusals before any write
    input: r01
    run: staging-wp
    setup: [staging-site, staging-db, config]
    cases:
      - name: production-match
        setup: [production-config, snapshot]
        command: [copy, --from, "${in}/db.sql", --to, "${site}", --config, "${work}/roadie.yaml", --url, "${staging_url}", --confirm-target, "${confirm}", --yes, --json]
        expect: {exit_code: 3, error_code: target-is-production, unchanged: true}
      - name: same-database
        setup: [snapshot]
        command: [copy, --from, "${staging_dsn}", --to, "${site}", --url, "${staging_url}", --confirm-target, "${confirm}", --yes, --json]
        expect: {exit_code: 3, error_code: target-is-source, unchanged: true}
      - name: says-production
        setup: [env-production, snapshot]
        command: *wp-copy
        expect: {exit_code: 3, error_code: target-says-production, unchanged: true}
      # The override passes this guard, so the prepare below stops at the
      # next one: the copy still calls itself production.
      - name: says-production-override
        setup: [env-production, snapshot]
        command: [prepare, "${site}", --target-is-staging, "${confirm}", --confirm-target, "${confirm}", --json]
        expect: {exit_code: 3, error_code: target-holds-production, unchanged: true}
      - name: holds-production
        setup: [snapshot]
        command: [prepare, "${site}", --confirm-target, "${confirm}", --json]
        expect: {exit_code: 3, error_code: target-holds-production, unchanged: true}
      - name: wrong-confirm-target
        setup: [snapshot]
        command: [prepare, "${site}", --production-url, "${production_url}", --confirm-target, shop.example.com, --json]
        expect: {exit_code: 2, error_code: prepare-confirm, unchanged: true}
      - name: yes-without-confirm
        setup: [snapshot]
        command: [prepare, "${site}", --production-url, "${production_url}", --yes, --json]
        expect: {exit_code: 2, error_code: prepare-confirm, unchanged: true}

