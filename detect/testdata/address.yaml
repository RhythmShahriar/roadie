# Fixtures for the street address detector (heuristic mode, PRD 15.2).
detector: pii.address
positive:
  - value: "12 Baker Street"
    table: wp_wc_order_addresses
    column: address_1
    row: {email: ada.kowalczyk@gmail.com}
  - value: "Flat 4"
    table: wp_postmeta
    column: meta_value
    row: {meta_key: _billing_address_2}
  - value: "Calle Mayor 5"
    table: wp_usermeta
    column: meta_value
    row: {meta_key: shipping_address_1}
  - value: "Hauptstraße 12"
    table: customers
    column: street
  - value: "12 Baker Street"
    kind: street
    column: line
  - value: "12 Mill Street"
    table: wp_usermeta
    column: meta_value
    row: {meta_key: shop_customer_address}
    note: a business word outside a settings table is still a customer's
  - value: "12 Baker Street"
    table: wp_wc_order_addresses
    column: address_1
    row: {email: ada.kowalczyk@gmail.com}
    allow:
      emails: [info@millstreet-bakery-demo.co.uk]
    note: another row's address stays flagged when only the business email is allowed
negative:
  - value: "12 Baker Street"
    table: wp_wc_order_addresses
    column: address_1
    row: {email: ada@example.com}
    note: sample data
  - value: "12 Baker Street"
    table: wp_wc_order_addresses
    column: address_1
    row: {email: ada.kowalczyk@gmail.com}
    allow:
      kept: [ada.kowalczyk@gmail.com]
  - value: "1 Main Street"
    table: wp_wc_order_addresses
    column: address_1
    needs: values
    note: a street from Roadie's lists
  - value: "81.2.69.160"
    table: wp_wc_orders
    column: ip_address
  - value: "ada@gmail.com"
    table: wp_customers
    column: email_address
  - value: "12"
    table: wp_wc_order_addresses
    column: address_1
    note: no letters
  - value: "12 Baker Street"
    table: wp_posts
    column: post_content
  - value: "12 Mill Street"
    table: wp_options
    column: option_value
    row: {option_name: woocommerce_store_address}
    note: the shop's own address in its settings
  - value: "12 Mill Street"
    table: wp_users
    column: address
    row: {user_email: info@millstreet-bakery-demo.co.uk}
    allow:
      emails: [info@millstreet-bakery-demo.co.uk]
    note: the business's own account
