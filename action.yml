# Roadie as a GitHub Action. See the wiki page Roadie-CI for examples:
# https://github.com/RhythmShahriar/rhythm/wiki/Roadie-CI
#
# Check a staging copy on every push, signed, with SARIF for code scanning:
#
#   permissions: {contents: read, security-events: write}
#     - uses: RhythmShahriar/roadie@v1.0.0
#       with: {target: "mysql://ci@127.0.0.1/staging", production: shop.com, sarif: "true", sarif-upload: "true"}
#       env: {ROADIE_TO_PASSWORD: "${{ secrets.STAGING_DB_PASSWORD }}"}
#
# Refresh staging from production every night over SSH:
#
#   on: {schedule: [{cron: "0 3 * * *"}]}
#     - uses: RhythmShahriar/roadie@v1.0.0
#       with:
#         mode: copy
#         source: ssh://deploy@shop.com/var/www/shop
#         target: ssh://deploy@staging.shop.com/var/www/staging
#         url: https://staging.shop.com
#         confirm-target: staging.shop.com
#         ssh-key: ${{ secrets.DEPLOY_KEY }}
#         known-hosts: ${{ secrets.KNOWN_HOSTS }}
#         args: --yes
#       env:
#         ROADIE_SIGNING_KEY: ${{ secrets.ROADIE_SIGNING_KEY }}
#
# Pin the Action by a release tag or commit SHA with the version in a
# comment: RhythmShahriar/roadie@<sha> # v1.0.0.
name: Rhythm Roadie
description: Is my staging a safe copy of production? Pseudonymised staging copies with live keys swapped and side effects off, proved by a signed report.
author: Rhythm Shahriar
branding:
  icon: shield
  color: orange

inputs:
  mode:
    description: >
      What to do: "verify" checks a staging copy for real people, live keys and production URLs;
      "copy" makes a pseudonymised copy of source at target and verifies it; "prepare" makes an
      existing staging copy safe in place; "plan" lists every change copy or prepare would make
      and makes none. Default verify.
    required: false
    default: verify
  source:
    description: >
      Modes copy and plan: production, as --from takes it: a dump file, a site folder,
      ssh://user@host/path, @alias or a database DSN. Default source: in the config.
    required: false
    default: ""
  target:
    description: >
      The staging copy, as --to (copy, plan) or the staging argument (prepare, verify) takes it: a dump
      file, a site folder, ssh://..., @alias or a DSN. Default target: in the config.
    required: false
    default: ""
  url:
    description: >
      The copy's URL, e.g. https://staging.shop.com. copy, prepare and plan rewrite production's URLs to
      it; verify fetches its robots.txt and home page headers (never a production host).
    required: false
    default: ""
  production:
    description: >
      Production hosts or URLs, comma-separated, e.g. shop.com,*.shop.com. Added to production: in the
      config. A target that matches is refused and verify reports any of them left in the copy.
    required: false
    default: ""
  confirm-target:
    description: >
      Modes copy and prepare: the target's host or database name, typed out (for a SQLite target its
      absolute file path or the file's name). Needed when the target is a site or a database, since a CI
      job has no terminal to ask on.
    required: false
    default: ""
  config:
    description: Settings file, passed as --config. Relative to working-directory. Default .roadie/config.yaml there.
    required: false
    default: ""
  working-directory:
    description: Folder every step runs in. Roadie reads .roadie/config.yaml and keeps .roadie/reports there.
    required: false
    default: "."
  fail-on:
    description: >
      Fail the job on findings at or above info, low, medium, high or critical. Default high.
      "none" never fails on findings.
    required: false
    default: high
  baseline:
    description: >
      Mode verify: a JSON report whose findings are accepted (test data you keep on purpose), passed
      as --baseline. Relative to working-directory.
    required: false
    default: ""
  allow-sample:
    description: >
      "true" accepts a verify that checked a sample of each table (--sample in args). Default "false":
      a sampled verify counts as failed, since it skipped rows.
    required: false
    default: "false"
  sarif:
    description: Mode verify. "true" also writes roadie.sarif (SARIF 2.1.0) next to the reports.
    required: false
    default: "false"
  sarif-upload:
    description: >
      "true" uploads roadie.sarif to GitHub code scanning (category roadie). Needs sarif "true" and
      "permissions: security-events: write". Warns in a public repository: alerts name tables and columns.
    required: false
    default: "false"
  args:
    description: >
      Extra flags, e.g. "--yes --keep-users 'admin,*@agency.example'". Split like a shell splits a
      command line (quotes and backslashes work) but never run through one: $VAR, $(...), ~ and
      globs reach Roadie as written.
    required: false
    default: ""
  version:
    description: >
      Roadie version to install, e.g. 1.0.0, or latest. Default the release that matches the Action's
      tag (RhythmShahriar/roadie@v1.0.0 installs 1.0.0), so results only change when you move the tag.
      At a branch or a major tag such as @v1 it installs the latest release and warns. The download is
      checked with cosign before it runs. Later Roadie steps in the same job reuse the install.
    required: false
    default: ""
  upload:
    description: >
      "true" uploads report.json, report.html and roadie.sarif as the roadie-report workflow artifact
      (roadie-report-2 and so on for later uses in the same job). Default "false": the reports name
      tables and columns and show masked values. Anyone who can read the repository can download an
      artifact. Warns in a public repository.
    required: false
    default: "false"
  summary-details:
    description: >
      "true" puts the full Markdown report in the job summary. Default "false": counts only, with no
      hosts, tables, columns or values.
    required: false
    default: "false"
  pr-comment:
    description: >
      "true" posts the job summary as one comment on the pull request and updates that comment on later
      runs. Needs "permissions: pull-requests: write".
    required: false
    default: "false"
  ssh-key:
    description: >
      A private key for ssh:// sources and targets, from a secret. Written to ~/.ssh/roadie_action_key
      (0600) and removed when the Action ends, with ~/.ssh/config and known_hosts put back as they were.
    required: false
    default: ""
  known-hosts:
    description: >
      Required with ssh-key: the host keys of your SSH hosts, as ssh-keyscan prints them, checked by
      hand and kept in a secret or the workflow. The Action never turns host key checking off.
    required: false
    default: ""

outputs:
  exit-code:
    description: Roadie's exit code (0 ok, 1 findings at or above fail-on, 2 usage error, 3 couldn't run, 130 interrupted).
    value: ${{ steps.run.outputs.exit-code }}
  verdict:
    description: >
      pass, fail, error or unchecked, as data.result in report.json. A verify that couldn't read all
      its input (INCOMPLETE) is error; a sampled verify is fail unless allow-sample is "true"; a copy
      or prepare run with --no-verify is unchecked (DONE), never pass.
    value: ${{ steps.run.outputs.verdict }}
  findings:
    description: How many findings are at or above fail-on.
    value: ${{ steps.run.outputs.findings }}
  report:
    description: Path of report.json, the signed report.
    value: ${{ steps.run.outputs.report }}
  html:
    description: Path of report.html.
    value: ${{ steps.run.outputs.html }}
  sarif-file:
    description: Path of roadie.sarif when sarif is "true".
    value: ${{ steps.run.outputs.sarif-file }}
  signature:
    description: The key ID that signed the report, e.g. roadie:7Q3kXc2bW9pLmN4a. Empty when it wasn't signed.
    value: ${{ steps.run.outputs.signature }}
  version:
    description: The Roadie version that ran, e.g. 1.0.0.
    value: ${{ steps.run.outputs.version || steps.version.outputs.version }}

runs:
  using: composite
  steps:
    # Every action is pinned by commit, so a moved tag can't change what
    # runs in your job. Dependabot keeps the pins current.
    - name: Pick the Roadie version
      id: version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: '"$GITHUB_ACTION_PATH/scripts/action-install.sh" check'

    - name: Install cosign
      if: steps.version.outputs.skip != 'true'
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

    - name: Install Roadie
      if: steps.version.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: '"$GITHUB_ACTION_PATH/scripts/action-install.sh" install'

    - name: Set up the SSH key
      if: inputs.ssh-key != ''
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: '"$GITHUB_ACTION_PATH/scripts/action-ssh.sh" setup'

    - name: Run Roadie
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        MODE: ${{ inputs.mode }}
        SOURCE: ${{ inputs.source }}
        TARGET: ${{ inputs.target }}
        URL: ${{ inputs.url }}
        PRODUCTION: ${{ inputs.production }}
        CONFIRM_TARGET: ${{ inputs.confirm-target }}
        CONFIG: ${{ inputs.config }}
        FAIL_ON: ${{ inputs.fail-on }}
        BASELINE: ${{ inputs.baseline }}
        ALLOW_SAMPLE: ${{ inputs.allow-sample }}
        SARIF: ${{ inputs.sarif }}
        SARIF_UPLOAD: ${{ inputs.sarif-upload }}
        ARGS: ${{ inputs.args }}
        UPLOAD: ${{ inputs.upload }}
        SUMMARY_DETAILS: ${{ inputs.summary-details }}
        PR_COMMENT: ${{ inputs.pr-comment }}
      run: '"$GITHUB_ACTION_PATH/scripts/action-run.sh" run'

    # Before anything else that could fail: the key must not outlive the
    # run on a self-hosted runner.
    - name: Remove the SSH key
      if: always() && inputs.ssh-key != ''
      shell: bash
      run: '"$GITHUB_ACTION_PATH/scripts/action-ssh.sh" cleanup'

    - name: Upload SARIF to code scanning
      if: always() && inputs.sarif-upload == 'true' && steps.run.outputs.sarif-file != ''
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ steps.run.outputs.sarif-file }}
        category: roadie

    - name: Upload the reports
      if: always() && inputs.upload == 'true' && steps.run.outputs.report != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ steps.run.outputs.artifact }}
        path: ${{ runner.temp }}/roadie-report/
        if-no-files-found: ignore

    - name: Comment on the pull request
      if: always() && inputs.pr-comment == 'true' && steps.run.outputs.summary != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        SUMMARY: ${{ steps.run.outputs.summary }}
      run: '"$GITHUB_ACTION_PATH/scripts/action-comment.sh" post "$SUMMARY"'

    - name: Fail on findings
      if: steps.run.outputs.exit-code == '1'
      shell: bash
      env:
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        echo "::error::Roadie found something at or above --fail-on ${FAIL_ON:-high}. See the job summary."
        exit 1
